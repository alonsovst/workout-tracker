<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --accent: #c8f135;
    --accent2: #f1c035;
    --text: #f0f0f0;
    --muted: #666;
    --danger: #ff4444;
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* only .scroll-area scrolls */
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 0.1em;
    color: var(--accent);
  }
  .session-clock {
    font-family: 'DM Mono', monospace;
    font-size: 1.1rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .session-clock span { color: var(--accent); }
  .progress-bar-wrap {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--border);
    z-index: 200;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.5s ease;
  }

  /* FIXED TOP SECTION (header + summary + timer) */
  .fixed-top {
    flex-shrink: 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 1rem 1rem 0;
  }

  /* SCROLL AREA — only this scrolls */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 0.5rem 1rem 4rem;
  }

  /* SESSION SUMMARY */
  .summary-strip {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
    margin-bottom: 1rem;
  }
  .sum-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
  }
  .sum-card .s-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .sum-card .s-val {
    font-family: 'DM Mono', monospace;
    font-size: 1.1rem;
    color: var(--accent);
  }

  /* TIMER PANEL */
  .timer-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1rem 1rem 1rem 1.25rem;
    margin-bottom: 0.5rem;
    position: relative;
    overflow: hidden;
    display: flex;
    gap: 0.75rem;
    align-items: stretch;
  }
  .timer-panel::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 150px; height: 150px;
    background: radial-gradient(circle, rgba(200,241,53,0.07) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  /* Left: all timer info */
  .timer-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .timer-ex-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.05em;
    color: var(--text);
    margin-bottom: 0.1rem;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .timer-set-info {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }
  .timer-display-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex: 1;
  }
  .timer-left {
    display: flex;
    flex-direction: column;
  }
  .timer-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 6.5rem;
    line-height: 1;
    letter-spacing: 0.02em;
    transition: color 0.3s;
  }
  .timer-big.work      { color: var(--accent); }
  .timer-big.rest      { color: var(--accent2); }
  .timer-big.done      { color: var(--muted); }
  .timer-big.countdown { color: var(--danger); }
  .timer-phase-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    align-self: flex-start;
  }
  .phase-work      { background: rgba(200,241,53,0.15); color: var(--accent); }
  .phase-rest      { background: rgba(241,192,53,0.15); color: var(--accent2); }
  .phase-done      { background: rgba(255,255,255,0.07); color: var(--muted); }
  .phase-countdown { background: rgba(255,68,68,0.15); color: var(--danger); }

  /* Progress ring */
  .ring-wrap {
    position: relative;
    width: 110px;
    height: 110px;
    flex-shrink: 0;
  }
  .ring-svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
  .ring-fg { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear; }
  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.3;
  }
  .ring-label strong { font-size: 15px; color: var(--text); }

  /* Right: vertical button column */
  .controls-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
    width: 64px;
  }
  .btn {
    padding: 0.6rem 0.5rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 100%;
    flex: 1;
  }
  .btn:hover { border-color: var(--muted); background: #222; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: #0a0a0a; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: #d4f545; }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: rgba(255,68,68,0.1); }
  .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* BLOCK SECTIONS */
  .block-section {
    margin-bottom: 1rem;
  }
  .block-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.6rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    margin-bottom: 2px;
    transition: border-color 0.2s;
  }
  .block-header.active { border-color: var(--accent); }
  .block-header.completed { border-color: #2a3a1a; }
  .block-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    width: 22px;
  }
  .block-title { flex: 1; font-size: 13px; font-weight: 500; }
  .block-status { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .block-check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .block-check.done { background: var(--accent); border-color: var(--accent); }
  .block-check svg { width: 10px; height: 10px; stroke: #0a0a0a; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

  .block-body { display: none; padding: 2px 0 6px; }
  .block-body.open { display: block; }

  /* EXERCISE ROW */
  .ex-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.65rem 1rem;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 8px;
    margin-bottom: 2px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .ex-row:hover { border-color: var(--border); }
  .ex-row.active { border-color: var(--accent); background: rgba(200,241,53,0.04); }
  .ex-row.done { background: var(--surface); opacity: 0.5; }
  .ex-row.done .ex-name { text-decoration: line-through; color: var(--muted); }
  .ex-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
  }
  .ex-row.done .ex-icon { background: rgba(200,241,53,0.1); border-color: rgba(200,241,53,0.2); }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex-meta { font-size: 13px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 3px; }
  .ex-sets-dots { display: flex; gap: 4px; flex-shrink: 0; }
  .set-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    transition: all 0.2s;
  }
  .set-dot.done { background: var(--accent); border-color: var(--accent); }
  .set-dot.active { border-color: var(--accent); background: rgba(200,241,53,0.3); }
  .ex-link { font-size: 11px; color: var(--muted); text-decoration: none; flex-shrink: 0; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--border); transition: all 0.15s; }
  .ex-link:hover { color: var(--accent); border-color: var(--accent); }

  /* FOCUS BUTTON on timer panel */
  .btn-focus {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    transition: color 0.15s;
    z-index: 2;
  }
  .btn-focus:hover { color: var(--text); }
  .btn-focus svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* FOCUS SCREEN — full-screen timer overlay */
  .focus-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    flex-direction: column;
    z-index: 500;
    padding: 0;
  }
  .focus-screen.show { display: flex; }

  .focus-topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 1rem 1.25rem 0.5rem;
    flex-shrink: 0;
  }
  .focus-block-label {
    font-size: 14px; /* 11px × 1.3 ≈ 30% larger */
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-align: center;
    padding: 0 1.5rem 0.4rem;
    flex-shrink: 0;
  }
  .btn-exit-focus {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn-exit-focus:hover { color: var(--text); border-color: var(--muted); }
  .btn-exit-focus svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  .focus-ex-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6rem;
    letter-spacing: 0.05em;
    color: var(--text);
    text-align: center;
    padding: 0 1.5rem;
    line-height: 1;
    flex-shrink: 0;
  }

  /* Big ring with countdown inside */
  .focus-ring-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 1rem 0;
  }
  .focus-ring-wrap {
    position: relative;
    width: min(72vw, 300px);
    height: min(72vw, 300px);
  }
  .focus-ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .focus-ring-bg  { fill: none; stroke: var(--border); stroke-width: 8; }
  .focus-ring-fg  { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear; }
  .focus-ring-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
  }
  .focus-phase-badge {
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .focus-count {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 18vw, 8rem);
    line-height: 1;
    letter-spacing: 0.02em;
    transition: color 0.3s;
  }
  .focus-set-label {
    font-family: 'DM Mono', monospace;
    font-size: 17px; /* 13px × 1.3 ≈ 30% larger */
    color: var(--muted);
    margin-top: 2px;
  }

  /* Set dots in focus mode */
  .focus-dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 0.5rem 0 1rem;
    flex-shrink: 0;
  }
  .focus-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid var(--border);
    transition: all 0.2s;
  }
  .focus-dot.done   { background: var(--accent); border-color: var(--accent); }
  .focus-dot.active { border-color: var(--accent); background: rgba(200,241,53,0.3); }

  /* Focus controls — 3 large buttons */
  .focus-controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding: 0 1.25rem 2rem;
    flex-shrink: 0;
  }
  .focus-btn {
    padding: 1rem 0.5rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .focus-btn:active { transform: scale(0.96); }
  .focus-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .focus-btn.primary { background: var(--accent); color: #0a0a0a; border-color: var(--accent); font-weight: 700; }
  .focus-btn.danger  { border-color: var(--danger); color: var(--danger); }

  /* COMPLETE SCREEN */
  .complete-screen {
    display: none;
    text-align: center;
    padding: 3rem 1rem;
  }
  .complete-screen.show { display: block; }
  .complete-trophy { font-size: 4rem; margin-bottom: 1rem; }
  .complete-title { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 0.5rem; }
  .complete-sub { color: var(--muted); font-size: 14px; margin-bottom: 2rem; }
  .complete-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; max-width: 400px; margin: 0 auto 2rem; }

  /* TOAST */
  /* FULL-SCREEN TOAST */
  .toast {
    position: fixed;
    inset: 0;
    background: var(--accent);
    color: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    z-index: 1500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 2rem;
  }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast-msg {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    letter-spacing: 0.05em;
    text-align: center;
    line-height: 1.1;
  }
  .toast-close {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
    background: rgba(0,0,0,0.15);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0a0a0a;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    transition: background 0.15s;
  }
  .toast-close:hover { background: rgba(0,0,0,0.25); }

  /* AUDIO UNLOCK BANNER */
  .audio-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(200,241,53,0.1);
    border-bottom: 1px solid var(--accent);
    padding: 1rem;
    text-align: center;
    z-index: 1000;
    display: none;
    animation: slideDown 0.3s ease;
  }
  .audio-banner.show {
    display: block;
  }
  .audio-banner.hide {
    animation: slideUp 0.3s ease forwards;
  }
  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes slideUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100%); opacity: 0; }
  }
  /* PULSING for active set */
  @keyframes pulse-border {
    0%, 100% { border-color: var(--accent); }
    50% { border-color: rgba(200,241,53,0.3); }
  }
  .ex-row.active { animation: pulse-border 2s infinite; }
</style>
</head>
<body>

<div class="progress-bar-wrap"><div class="progress-bar-fill" id="globalBar"></div></div>

<header>
  <div class="logo">Workout</div>
  <div class="session-clock">Session <span id="sessionTimer">00:00</span></div>
</header>

<!-- ALWAYS-VISIBLE TOP SECTION -->
<div class="fixed-top">
  <div class="summary-strip">
    <div class="sum-card"><div class="s-label">Done</div><div class="s-val" id="sumDone">0/15</div></div>
    <div class="sum-card"><div class="s-label">Sets left</div><div class="s-val" id="sumSets">28</div></div>
    <div class="sum-card"><div class="s-label">Block</div><div class="s-val" id="sumBlock">1/5</div></div>
  </div>

  <!-- TIMER PANEL -->
  <div class="timer-panel" id="timerPanel">
    <!-- Left: timer info -->
    <div class="timer-body">
      <div class="timer-ex-name" id="tExName">Dead Hang</div>
      <div class="timer-display-row">
        <div class="timer-left">
          <div class="timer-phase-badge phase-work" id="tPhaseBadge">Work</div>
          <div class="timer-big work" id="tCountdown">40</div>
        </div>
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 110 110" width="110" height="110">
            <circle class="ring-bg" cx="55" cy="55" r="48"/>
            <circle class="ring-fg" id="ringFg" cx="55" cy="55" r="48" stroke="#c8f135" stroke-dasharray="301.6" stroke-dashoffset="0"/>
          </svg>
          <div class="ring-label"><strong id="ringSet">1/2</strong>sets</div>
        </div>
      </div>
    </div>
    <!-- Right: vertical buttons — Done top, Start bottom -->
    <div class="controls-col">
      <button class="btn" onclick="markSetDone()">
        <svg viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg> Done
      </button>
      <button class="btn primary" id="btnStart" onclick="startStop()">
        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg> Start
      </button>
    </div>
    <!-- Focus mode toggle -->
    <button class="btn-focus" onclick="enterFocus()" title="Full screen">
      <svg viewBox="0 0 24 24"><polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>
  </div>
</div>

<!-- FOCUS SCREEN -->
<div class="focus-screen" id="focusScreen">
  <div class="focus-topbar">
    <button class="btn-exit-focus" onclick="exitFocus()">
      <svg viewBox="0 0 24 24"><polyline points="9,15 3,21 3,15"/><polyline points="15,9 21,3 21,9"/><line x1="3" y1="21" x2="21" y2="3"/></svg>
      Back
    </button>
  </div>
  <div class="focus-ex-name" id="fExName">Dead Hang</div>
  <div class="focus-block-label" id="fBlockLabel">Block 1 · Warm-up</div>
  <div class="focus-ring-area">
    <div class="focus-ring-wrap">
      <svg class="focus-ring-svg" viewBox="0 0 240 240">
        <circle class="focus-ring-bg" cx="120" cy="120" r="106"/>
        <circle class="focus-ring-fg" id="focusRingFg" cx="120" cy="120" r="106" stroke="#c8f135" stroke-dasharray="666" stroke-dashoffset="0"/>
      </svg>
      <div class="focus-ring-inner">
        <div class="focus-phase-badge phase-work" id="fPhaseBadge">Work</div>
        <div class="focus-count work" id="fCountdown">40</div>
        <div class="focus-set-label" id="fSetLabel">Set 1/2</div>
      </div>
    </div>
  </div>
  <div class="focus-dots" id="fDots"></div>
  <div class="focus-controls">
    <button class="focus-btn danger" onclick="resetCurrent()">
      <svg viewBox="0 0 24 24"><polyline points="1,4 1,10 7,10"/><path d="M3.51,15a9,9,0,1,0,.49-3"/></svg>
      Reset
    </button>
    <button class="focus-btn" onclick="markSetDone()">
      <svg viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>
      Done
    </button>
    <button class="focus-btn primary" id="fBtnStart" onclick="startStop()">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      Start
    </button>
  </div>
</div>

<!-- SCROLLABLE EXERCISE LIST -->
<div class="scroll-area">
  <div id="blockList"></div>

  <!-- COMPLETE SCREEN -->
  <div class="complete-screen" id="completeScreen">
    <div class="complete-trophy">🏋️</div>
    <div class="complete-title">Sesión Completa</div>
    <div class="complete-sub" id="completeSub">Tiempo total: —</div>
    <div class="complete-stats">
      <div class="sum-card"><div class="s-label">Ejercicios</div><div class="s-val">15</div></div>
      <div class="sum-card"><div class="s-label">Series</div><div class="s-val">28</div></div>
      <div class="sum-card"><div class="s-label">Bloques</div><div class="s-val">5</div></div>
    </div>
    <button class="btn primary" style="max-width:200px; margin:0 auto;" onclick="resetAll()">Nueva Sesión</button>
  </div>
</div>

<div class="toast" id="toast">
  <button class="toast-close" onclick="dismissToast()">✕</button>
  <div class="toast-msg" id="toastMsg"></div>
</div>

<script>
const DATA = [
  { id:1, blockLabel:"Block 1 · Warm-up / Shoulder prep", blockColor:"#c8f135",
    exercises:[
      { name:"Dead Hang", sets:2, work:40, rest:20, icon:"🧲", url:"https://www.youtube.com/results?search_query=dead+hang+exercise" },
      { name:"Scapular Pull-ups", sets:2, work:40, rest:20, icon:"🔼", url:"https://www.youtube.com/results?search_query=scapular+pull+ups" },
      { name:"Australian Rows", sets:2, work:40, rest:20, icon:"🚣", url:"https://www.youtube.com/results?search_query=australian+rows+exercise" },
      { name:"Cable Wide Pull", sets:2, work:90, rest:20, icon:"🔗", url:"https://weighttraining.guide/exercises/cable-wide-grip-upright-row/" },
    ]
  },
  { id:2, blockLabel:"Block 2 · Back + Biceps", blockColor:"#f1c035",
    exercises:[
      { name:"Pull-ups (Pronated)", sets:2, work:40, rest:20, icon:"💪", url:"https://www.youtube.com/results?search_query=pull+ups+pronated+grip" },
      { name:"Chin-ups (Supinated)", sets:2, work:40, rest:20, icon:"🤙", url:"https://www.youtube.com/results?search_query=chin+ups+supinated" },
      { name:"Behind-the-neck Pull-up", sets:2, work:90, rest:20, icon:"🔙", url:"https://weighttraining.guide/exercises/behind-the-neck-lat-pull-down/" },
    ]
  },
  { id:3, blockLabel:"Block 3 · Chest + Triceps", blockColor:"#f16c35",
    exercises:[
      { name:"Bench Dip", sets:2, work:90, rest:20, icon:"🏋️", url:"https://weighttraining.guide/exercises/bench-dip/" },
      { name:"Push-ups (Feet Elevated)", sets:2, work:40, rest:20, icon:"⬆️", url:"https://www.youtube.com/results?search_query=push+ups+feet+elevated" },
      { name:"Dumbbell Press", sets:2, work:90, rest:20, icon:"🥊", url:"https://weighttraining.guide/exercises/dumbbell/" },
    ]
  },
  { id:4, blockLabel:"Block 4 · Core / Abs", blockColor:"#a878f0",
    exercises:[
      { name:"Leg / Knee Raises", sets:2, work:40, rest:20, icon:"🦵", url:"https://www.youtube.com/results?search_query=hanging+leg+raises+bar" },
      { name:"L-sit Hold", sets:2, work:40, rest:20, icon:"📐", url:"https://www.youtube.com/results?search_query=l+sit+hold+parallettes" },
      { name:"Toes to Bar", sets:2, work:40, rest:20, icon:"🎯", url:"https://www.youtube.com/results?search_query=toes+to+bar" },
    ]
  },
  { id:5, blockLabel:"Block 5 · Power Finisher", blockColor:"#ff6b6b",
    exercises:[
      { name:"Explosive / Clapping Pull-ups", sets:1, work:40, rest:20, icon:"👏", url:"https://www.youtube.com/results?search_query=explosive+clapping+pull+ups" },
      { name:"Burpees / Mountain Climbers", sets:1, work:40, rest:20, icon:"🏃", url:"https://www.youtube.com/results?search_query=burpees+mountain+climbers" },
      { name:"Bar Hang to Failure", sets:1, work:40, rest:20, icon:"⚡", url:"https://www.youtube.com/results?search_query=dead+hang+to+failure" },
    ]
  }
];

// AUDIO — AudioContext created inside the Start user-gesture so iOS allows
// timer-triggered playback without further interaction.
let audioUnlocked = false;
let _audioCtx = null;
let _firstStart = true;
let _isFirstExerciseStart = false;
const _startAudio = new Audio('start.mp3'); // played in user-gesture context, so regular Audio is fine
let _moveonBuffer    = null; // decoded via AudioContext so it can fire from the timer
let _completedBuffer = null;

// Called from startStop() — must run inside a real user tap on iOS
function _unlockAudioOnce() {
  if (audioUnlocked) return;
  try {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // iOS starts AudioContext in 'suspended'; resume() inside gesture unlocks it permanently
    _audioCtx.resume().then(() => { audioUnlocked = true; });
    // Kick a silent buffer so the session registers immediately
    const buf = _audioCtx.createBuffer(1, 1, _audioCtx.sampleRate);
    const src = _audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(_audioCtx.destination);
    src.start(0);
    audioUnlocked = true; // set synchronously too as belt-and-suspenders
    // Decode MP3s via AudioContext so they can fire from setInterval (iOS requirement)
    fetch('moveon.mp3').then(r => r.arrayBuffer()).then(ab => _audioCtx.decodeAudioData(ab)).then(buf => { _moveonBuffer = buf; }).catch(() => {});
    fetch('completed.mp3').then(r => r.arrayBuffer()).then(ab => _audioCtx.decodeAudioData(ab)).then(buf => { _completedBuffer = buf; }).catch(() => {});
  } catch(e) {}
}

function _playBuffer(buf) {
  if (!_audioCtx || !buf) return;
  try {
    const src = _audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(_audioCtx.destination);
    src.start(0);
  } catch(e) {}
}
function _playMoveon()    { _playBuffer(_moveonBuffer); }
function _playCompleted() { _playBuffer(_completedBuffer); }

function _playTone(hz, durSec) {
  if (!_audioCtx) return;
  try {
    const osc  = _audioCtx.createOscillator();
    const gain = _audioCtx.createGain();
    osc.connect(gain);
    gain.connect(_audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = hz;
    const t = _audioCtx.currentTime;
    gain.gain.setValueAtTime(0.6, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + durSec);
    osc.start(t);
    osc.stop(t + durSec);
  } catch(e) {}
}

function playAlarm(type = 'beep') {
  if (!audioUnlocked || !_audioCtx) return;
  const hz = type === 'rest' ? 600 : 800;
  _playTone(hz, 0.22);
  setTimeout(() => _playTone(hz, 0.22), 260);
  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
}

// STATE
let state = {
  running: false,
  sessionStart: null,
  sessionElapsed: 0,
  sessionInterval: null,
  currentBlockIdx: 0,
  currentExIdx: 0,
  currentSet: 0,      // 0-based
  phase: 'work',      // 'work' | 'rest' | 'idle'
  timeLeft: 0,
  timerInterval: null,
  blocks: DATA.map(b => ({
    open: false,
    exercises: b.exercises.map(e => ({ setsCompleted: 0, done: false }))
  }))
};
state.blocks[0].open = true;

const CIRCUMFERENCE = 2 * Math.PI * 48; // matches ring r=48 → 301.6

// HELPERS
function totalExercises() { return DATA.reduce((a,b) => a + b.exercises.length, 0); }
function totalSets() { return DATA.reduce((a,b) => a + b.exercises.reduce((c,e) => c + e.sets, 0), 0); }
function completedExercises() { return state.blocks.reduce((a,b) => a + b.exercises.filter(e=>e.done).length, 0); }
function completedSets() { return state.blocks.reduce((a,b,bi) => a + b.exercises.reduce((c,e,ei) => c + e.setsCompleted, 0), 0); }
function secondsLeft() {
  let s = 0;
  DATA.forEach((b,bi) => {
    b.exercises.forEach((e,ei) => {
      const st = state.blocks[bi].exercises[ei];
      if (!st.done) {
        const rem = e.sets - st.setsCompleted;
        s += rem * (e.work + e.rest);
      }
    });
  });
  return s;
}
function fmtTime(s) {
  const m = Math.floor(s/60), sec = s%60;
  return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}
function fmtClock(s) {
  const m = String(Math.floor(s/60)).padStart(2,'0');
  const sc = String(s%60).padStart(2,'0');
  return `${m}:${sc}`;
}
function currentEx() { return DATA[state.currentBlockIdx].exercises[state.currentExIdx]; }
function currentExState() { return state.blocks[state.currentBlockIdx].exercises[state.currentExIdx]; }

let _toastTimer = null;
function showToast(msg) {
  document.getElementById('toastMsg').textContent = msg;
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(dismissToast, 3000);
}
function dismissToast() {
  document.getElementById('toast').classList.remove('show');
  clearTimeout(_toastTimer);
}

// BUILD UI
function buildList() {
  const list = document.getElementById('blockList');
  list.innerHTML = '';
  DATA.forEach((b,bi) => {
    const bState = state.blocks[bi];
    const allDone = bState.exercises.every(e => e.done);
    const isActive = bi === state.currentBlockIdx;

    const section = document.createElement('div');
    section.className = 'block-section';
    section.id = `block-${bi}`;

    const hdr = document.createElement('div');
    hdr.className = 'block-header' + (isActive ? ' active' : '') + (allDone ? ' completed' : '');
    const doneCnt = bState.exercises.filter(e=>e.done).length;
    hdr.innerHTML = `
      <div class="block-num" style="color:${b.blockColor}">${bi+1}</div>
      <div class="block-title">${b.blockLabel.split('·')[1].trim()}</div>
      <div class="block-status">${doneCnt}/${b.exercises.length}</div>
      <div class="block-check ${allDone?'done':''}">
        <svg viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>
      </div>
    `;
    hdr.onclick = () => { bState.open = !bState.open; buildList(); };

    const body = document.createElement('div');
    body.className = 'block-body' + (bState.open ? ' open' : '');

    b.exercises.forEach((e,ei) => {
      const es = bState.exercises[ei];
      const isActiveEx = isActive && ei === state.currentExIdx;
      const row = document.createElement('div');
      row.className = 'ex-row' + (isActiveEx ? ' active' : '') + (es.done ? ' done' : '');
      row.id = `ex-${bi}-${ei}`;

      let dots = '';
      for(let s=0; s<e.sets; s++) {
        const cls = s < es.setsCompleted ? 'done' : (isActiveEx && s === state.currentSet ? 'active' : '');
        dots += `<div class="set-dot ${cls}"></div>`;
      }

      row.innerHTML = `
        <div class="ex-info">
          <div class="ex-name">${e.name}</div>
          <div class="ex-meta">${e.sets}×${e.work}s · rest ${e.rest}s</div>
        </div>
        <div class="ex-sets-dots">${dots}</div>
        <a class="ex-link" href="${e.url}" target="_blank">▶</a>
      `;
      row.onclick = (ev) => {
        if(ev.target.tagName === 'A') return;
        jumpTo(bi, ei);
      };
      body.appendChild(row);
    });

    section.appendChild(hdr);
    section.appendChild(body);
    list.appendChild(section);
  });
}

const FOCUS_CIRCUMFERENCE = 2 * Math.PI * 106; // focus ring r=106 ≈ 666

function updateTimerPanel() {
  const b = DATA[state.currentBlockIdx];
  const e = b.exercises[state.currentExIdx];
  document.getElementById('tExName').textContent    = e.name;
  document.getElementById('fExName').textContent    = e.name;
  document.getElementById('fBlockLabel').textContent = b.blockLabel;
  document.getElementById('ringSet').textContent    = `${state.currentSet+1}/${e.sets}`;
  document.getElementById('fSetLabel').textContent  = `Set ${state.currentSet+1}/${e.sets}`;
  // Focus set dots
  const dots = document.getElementById('fDots');
  dots.innerHTML = '';
  for(let s=0; s<e.sets; s++) {
    const d = document.createElement('div');
    const isCur = state.currentBlockIdx === state.currentBlockIdx; // always same ex
    const cls = s < (currentExState().setsCompleted) ? 'done'
              : (s === state.currentSet ? 'active' : '');
    d.className = `focus-dot ${cls}`;
    dots.appendChild(d);
  }
  updateCountdownDisplay();
}

function updateCountdownDisplay() {
  const e = currentEx();
  const total = state.phase === 'countdown' ? 5
              : state.phase === 'work'       ? e.work : e.rest;
  const left = state.timeLeft;
  const pct = total > 0 ? left / total : 0;

  // Main panel
  const cd    = document.getElementById('tCountdown');
  const badge = document.getElementById('tPhaseBadge');
  const ring  = document.getElementById('ringFg');
  // Focus panel
  const fcd    = document.getElementById('fCountdown');
  const fbadge = document.getElementById('fPhaseBadge');
  const fring  = document.getElementById('focusRingFg');

  let color, badgeClass, badgeText;
  if(state.phase === 'countdown') {
    color = '#ff4444'; badgeClass = 'phase-countdown'; badgeText = 'Get Ready';
    cd.className  = 'timer-big countdown';
    fcd.className = 'focus-count countdown';
  } else if(state.phase === 'work') {
    color = '#c8f135'; badgeClass = 'phase-work'; badgeText = 'Work';
    cd.className  = 'timer-big work';
    fcd.className = 'focus-count work';
  } else {
    color = '#f1c035'; badgeClass = 'phase-rest'; badgeText = 'Rest';
    cd.className  = 'timer-big rest';
    fcd.className = 'focus-count rest';
  }

  cd.textContent = fcd.textContent = left;
  badge.className  = `timer-phase-badge ${badgeClass}`;
  fbadge.className = `focus-phase-badge ${badgeClass}`;
  badge.textContent = fbadge.textContent = badgeText;
  ring.style.stroke  = fring.style.stroke  = color;
  ring.style.strokeDashoffset  = CIRCUMFERENCE      * (1 - pct);
  fring.style.strokeDashoffset = FOCUS_CIRCUMFERENCE * (1 - pct);
}

// FOCUS MODE
function enterFocus() {
  document.getElementById('focusScreen').classList.add('show');
  updateTimerPanel();
}
function exitFocus() {
  document.getElementById('focusScreen').classList.remove('show');
}

// Keep both Start buttons in sync
function syncStartBtn(type) {
  const PAUSE_SVG  = '<svg viewBox="0 0 24 24"><line x1="6" y1="4" x2="6" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/></svg>';
  const PLAY_SVG   = '<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>';
  const b1 = document.getElementById('btnStart');
  const b2 = document.getElementById('fBtnStart');
  if (type === 'pause') {
    if(b1) { b1.innerHTML = PAUSE_SVG + ' Pause';  b1.className = 'btn primary'; }
    if(b2) { b2.innerHTML = PAUSE_SVG + ' Pause';  b2.className = 'focus-btn primary'; }
  } else if (type === 'resume') {
    if(b1) { b1.innerHTML = PLAY_SVG  + ' Resume'; b1.className = 'btn primary'; }
    if(b2) { b2.innerHTML = PLAY_SVG  + ' Resume'; b2.className = 'focus-btn primary'; }
  } else {
    if(b1) { b1.innerHTML = PLAY_SVG  + ' Start';  b1.className = 'btn primary'; }
    if(b2) { b2.innerHTML = PLAY_SVG  + ' Start';  b2.className = 'focus-btn primary'; }
  }
}

function updateSummary() {
  const done = completedExercises();
  const total = totalExercises();
  document.getElementById('sumDone').textContent = `${done}/${total}`;
  const setsLeft = totalSets() - completedSets();
  document.getElementById('sumSets').textContent = setsLeft;
  document.getElementById('sumBlock').textContent = `${state.currentBlockIdx+1}/5`;
  const pct = done / total * 100;
  document.getElementById('globalBar').style.width = pct + '%';
}

// START/STOP
function startStop() {
  _unlockAudioOnce(); // unlock audio on first user tap (required by iOS)
  if(!state.running) {
    // Play hype audio on the very first Start tap only
    if(_firstStart) {
      _firstStart = false;
      try { _startAudio.currentTime = 0; _startAudio.play().catch(() => {}); } catch(e) {}
    }
    if(!state.sessionStart) {
      state.sessionStart = Date.now() - state.sessionElapsed * 1000;
      state.sessionInterval = setInterval(() => {
        state.sessionElapsed = Math.floor((Date.now() - state.sessionStart) / 1000);
        document.getElementById('sessionTimer').textContent = fmtClock(state.sessionElapsed);
      }, 1000);
    }
    state.running = true;
    syncStartBtn('pause');
    runTimer(); // runTimer always starts with 5s countdown
  } else {
    pauseTimer();
  }
}

function pauseTimer() {
  state.running = false;
  clearInterval(state.timerInterval);
  syncStartBtn('resume');
}

function runTimer() {
  clearInterval(state.timerInterval);
  // Always start with a 5-second get-ready countdown
  state.phase = 'countdown';
  state.timeLeft = 5;
  updateCountdownDisplay();

  state.timerInterval = setInterval(() => {
    if(!state.running) return;
    state.timeLeft--;
    updateCountdownDisplay();
    if(state.timeLeft <= 0) {
      if(state.phase === 'countdown') {
        // Countdown done — begin work, fire chime to signal timer has started
        state.phase = 'work';
        state.timeLeft = currentEx().work;
        playAlarm('beep');
        updateCountdownDisplay();
      } else if(state.phase === 'work') {
        // Move to rest
        state.phase = 'rest';
        state.timeLeft = currentEx().rest;
        playAlarm('rest');
        showToast('✅ Rest time!');
        updateCountdownDisplay();
      } else {
        // Set complete — check if this finishes the exercise before playing sound
        const _es = currentExState();
        const _e  = currentEx();
        const _lastSet = (_es.setsCompleted + 1) >= _e.sets;
        const _isLastEx = state.currentBlockIdx === DATA.length - 1 &&
                          state.currentExIdx === DATA[state.currentBlockIdx].exercises.length - 1;
        if(_lastSet && !_isLastEx) {
          _playMoveon(); // exercise done, more to come
        } else if(!_lastSet) {
          playAlarm('beep'); // mid-exercise set complete
        }
        // if _lastSet && _isLastEx: completed.mp3 plays in advanceExercise
        finishSet();
      }
    }
  }, 1000);
}

function finishSet() {
  const es = currentExState();
  es.setsCompleted++;
  state.currentSet++;
  const e = currentEx();

  if(state.currentSet >= e.sets) {
    // Exercise complete
    es.done = true;
    showToast(`💪 ${e.name} done!`);
    advanceExercise();
  } else {
    state.phase = 'work';
    state.timeLeft = e.work;
    updateTimerPanel();
    buildList();
    updateSummary();
    showToast(`Set ${state.currentSet+1} — go!`);
  }
}

function advanceExercise() {
  const block = DATA[state.currentBlockIdx];
  state.currentExIdx++;

  if(state.currentExIdx >= block.exercises.length) {
    // Block complete — collapse it
    const prevIdx = state.currentBlockIdx;
    state.blocks[prevIdx].open = false;
    state.currentBlockIdx++;
    state.currentExIdx = 0;

    if(state.currentBlockIdx >= DATA.length) {
      // ALL DONE
      clearInterval(state.timerInterval);
      clearInterval(state.sessionInterval);
      state.running = false;
      _playCompleted();
      document.querySelector('.fixed-top').style.display = 'none';
      const cs = document.getElementById('completeScreen');
      cs.classList.add('show');
      document.getElementById('completeSub').textContent = 'Total time: ' + fmtClock(state.sessionElapsed);
      return;
    }
    // Expand next block
    state.blocks[state.currentBlockIdx].open = true;
  }

  state.currentSet = 0;
  state.phase = 'work';
  state.timeLeft = currentEx().work;

  // Pause — user must press Start to begin the next exercise
  clearInterval(state.timerInterval);
  state.running = false;
  syncStartBtn('start');

  updateTimerPanel();
  buildList();
  updateSummary();

  // Scroll to active
  setTimeout(() => {
    const el = document.getElementById(`ex-${state.currentBlockIdx}-${state.currentExIdx}`);
    if(el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

function skipPhase() {
  clearInterval(state.timerInterval);
  const es = currentExState();
  const e = currentEx();
  es.setsCompleted = e.sets;
  es.done = true;
  state.phase = 'work';
  state.timeLeft = 0;
  advanceExercise(); // advanceExercise now always pauses — no runTimer() needed
}

function markSetDone() {
  clearInterval(state.timerInterval);
  state.timeLeft = 0;
  finishSet();
  if(state.running) runTimer(); // only resumes if still within same exercise (finishSet didn't advance)
}

function jumpTo(bi, ei) {
  clearInterval(state.timerInterval);
  pauseTimer();
  state.currentBlockIdx = bi;
  state.currentExIdx = ei;
  state.currentSet = state.blocks[bi].exercises[ei].setsCompleted;
  state.phase = 'work';
  state.timeLeft = DATA[bi].exercises[ei].work;
  state.blocks[bi].open = true;
  updateTimerPanel();
  buildList();
  updateSummary();
  document.getElementById('btnStart').innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><polygon points="5,3 19,12 5,21"/></svg> Start';
  showToast(`Jumped to ${DATA[bi].exercises[ei].name}`);
}

function resetCurrent() {
  clearInterval(state.timerInterval);
  state.running = false;
  state.phase = 'work';
  state.timeLeft = currentEx().work;
  document.getElementById('btnStart').innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><polygon points="5,3 19,12 5,21"/></svg> Start';
  updateCountdownDisplay();
  showToast('Timer reset');
}

function resetAll() {
  _firstStart = true;
  _isFirstExerciseStart = false;
  clearInterval(state.timerInterval);
  clearInterval(state.sessionInterval);
  state = {
    running: false, sessionStart: null, sessionElapsed: 0,
    sessionInterval: null, currentBlockIdx: 0, currentExIdx: 0,
    currentSet: 0, phase: 'work', timeLeft: 0,
    timerInterval: null,
    blocks: DATA.map(b => ({ open: false, exercises: b.exercises.map(e => ({ setsCompleted: 0, done: false })) }))
  };
  state.blocks[0].open = true;
  document.querySelector('.fixed-top').style.display = '';
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('sessionTimer').textContent = '00:00';
  document.getElementById('btnStart').innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><polygon points="5,3 19,12 5,21"/></svg> Start';
  document.getElementById('globalBar').style.width = '0%';
  updateTimerPanel();
  buildList();
  updateSummary();
}

state.timeLeft = currentEx().work;

buildList();
